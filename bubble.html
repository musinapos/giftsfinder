<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bubble Shooter - GiftsFinder</title>
<style>
body{margin:0;background:#111;text-align:center;font-family:Arial;color:#fff}
h1{color:gold;margin:10px}
#door{padding:15px 30px;font-size:22px;background:gold;border:0;border-radius:12px;font-weight:bold;margin:10px}
#back{display:inline-block;padding:10px 20px;background:#fff;color:#000;border-radius:10px;text-decoration:none;font-weight:bold;margin:5px}
canvas{background:#222;border:3px solid gold;border-radius:12px;max-width:95%}
#score{font-size:20px;color:gold}
</style>
</head>
<body>
<h1>🎁 GiftsFinder 🎁</h1>
<a id="back" href="index.html">🏠 HOME - Back To House</a><br>
<div id="score">Score: 0</div>
<button id="door" onclick="startGame()">🚪 TAP HERE - ENTER BUBBLE ROOM - PLAY ▶️</button><br>
<canvas id="c" width="360" height="500"></canvas>
<p>👆 TAP TOP to AIM & SHOOT 👆<br>Match 3 same colours = POP 💥</p>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const colors=['red','lime','yellow','cyan','magenta','orange'];
let bubbles=[],ball=null,score=0,playing=false,angle=-Math.PI/2;
function newBubble(x,y){return{x:x,y:y,r:18,c:colors[Math.floor(Math.random()*colors.length)],dead:false}}
function startGame(){
playing=true;score=0;bubbles=[];ball=null;
document.getElementById('door').innerText='🔥 PLAYING - SHOOT! 🔥';
for(let r=0;r<4;r++)for(let i=0;i<9;i++)bubbles.push(newBubble(27+i*36+(r%2?18:0),27+r*32));
nextBall();draw();
}
function nextBall(){ball=newBubble(180,470);ball.c=colors[Math.floor(Math.random()*colors.length)];}
function draw(){
ctx.clearRect(0,0,360,500);
bubbles.forEach(b=>{if(!b.dead){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fillStyle=b.c;ctx.fill();ctx.strokeStyle='#fff';ctx.stroke();}});
if(ball){ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fillStyle=ball.c;ctx.fill();ctx.strokeStyle='#fff';ctx.stroke();
ctx.beginPath();ctx.moveTo(180,470);ctx.lineTo(180+Math.cos(angle)*70,470+Math.sin(angle)*70);ctx.strokeStyle='gold';ctx.lineWidth=3;ctx.stroke();}
document.getElementById('score').innerText='Score: '+score;
}
cv.addEventListener('click',e=>{
if(!playing)return;
const rect=cv.getBoundingClientRect();
const mx=(e.clientX-rect.left)*(360/rect.width),my=(e.clientY-rect.top)*(500/rect.height);
angle=Math.atan2(my-470,mx-180);
let bx=180,by=470;
let iv=setInterval(()=>{
bx+=Math.cos(angle)*10;by+=Math.sin(angle)*10;
if(bx<18||bx>342)angle=Math.PI-angle;
let hit=bubbles.find(b=>!b.dead&&Math.hypot(b.x-bx,b.y-by)<36);
if(hit||by<30){
clearInterval(iv);
let nb=newBubble(Math.max(20,Math.min(340,bx)),Math.max(25,by));nb.c=ball.c;bubbles.push(nb);
let same=bubbles.filter(b=>!b.dead&&b.c===nb.c&&Math.hypot(b.x-nb.x,b.y-nb.y)<70);
if(same.length>=2){same.forEach(b=>b.dead=true);nb.dead=true;score+=same.length*10+10;}
bubbles=bubbles.filter(b=>!b.dead);
nextBall();
}
ball.x=bx;ball.y=by;draw();
if(by<30||hit){ball=null;draw();nextBall();draw();}
},30);
});
draw();
</script>
</body>
</html>
